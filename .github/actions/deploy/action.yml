name: Deploy
description: Deploy
inputs:
  environment:
    description: "The environment to deploy to"
    required: true
  aws-key-id:
    description: "The AWS key to use"
    required: true
  aws-secret-access-key:
    description: "AWS secret access key to use"
    required: true
  op-service-account-token:
    description: "1Password service account token"
    required: true
  version:
    description: "Application version to expose at runtime"
    required: false
runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.14.5"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ inputs.aws-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: eu-west-2
        mask-aws-account-id: true

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.14.5"

    - name: Load secrets
      id: load_secrets
      uses: 1password/load-secrets-action@v3
      with:
        export-env: true
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-service-account-token }}
        SPOTIFY_CLIENT_ID: op://ci-cd/lho-lambda/SPOTIFY_CLIENT_ID
        SPOTIFY_CLIENT_SECRET: op://ci-cd/lho-lambda/SPOTIFY_CLIENT_SECRET
        SPOTIFY_REFRESH_TOKEN: op://ci-cd/lho-lambda/SPOTIFY_REFRESH_TOKEN
        LASTFM_API_KEY: op://ci-cd/lho-lambda/LASTFM_API_KEY
        LASTFM_USERNAME: op://ci-cd/lho-lambda/LASTFM_USERNAME
        SENTRY_DSN: op://ci-cd/lho-lambda/SENTRY_DSN
        OP_ENV_FILE: ".env"

    - name: Set Terraform variables
      shell: bash
      run: |
        echo "TF_VAR_spotify_client_id=$SPOTIFY_CLIENT_ID" >> $GITHUB_ENV
        echo "TF_VAR_spotify_client_secret=$SPOTIFY_CLIENT_SECRET" >> $GITHUB_ENV
        echo "TF_VAR_spotify_refresh_token=$SPOTIFY_REFRESH_TOKEN" >> $GITHUB_ENV
        echo "TF_VAR_lastfm_api_key=$LASTFM_API_KEY" >> $GITHUB_ENV
        echo "TF_VAR_lastfm_username=$LASTFM_USERNAME" >> $GITHUB_ENV
        echo "TF_VAR_sentry_dsn=$SENTRY_DSN" >> $GITHUB_ENV

    - name: Terraform init
      shell: bash
      working-directory: terraform
      run: |
        terraform init -backend-config="key=vpc/${{ inputs.environment }}.tfstate" -backend-config="bucket=nowplaying-${{ inputs.environment }}-terraform-state" -input=false

    - name: Deploy DynamoDB lock table if not exists
      shell: bash
      working-directory: terraform
      run: terraform apply -auto-approve -input=false -target=aws_dynamodb_table.dynamodb_terraform_lock

    - name: Terraform fmt -check
      shell: bash
      working-directory: terraform
      run: terraform fmt -check

    - name: Terraform validate
      shell: bash
      working-directory: terraform
      run: terraform validate

    - name: Build functions for Lambda
      shell: bash
      run: |
        dotnet publish src/Lho.Lambda/Lho.Lambda.csproj \
          --configuration Release \
          --runtime linux-x64 \
          --self-contained false \
          -p:PublishReadyToRun=true \
          --output .build/release/lambda-package
        dotnet publish src/Lho.Lambda.Authorizer/Lho.Lambda.Authorizer.csproj \
          --configuration Release \
          --runtime linux-x64 \
          --self-contained false \
          -p:PublishReadyToRun=true \
          --output .build/release/authorizer-package

    - name: Get version
      id: version
      shell: bash
      env:
        DEPLOY_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$DEPLOY_VERSION" ]; then
          echo "Using provided version: $DEPLOY_VERSION"
          echo "APP_VERSION=$DEPLOY_VERSION" >> $GITHUB_ENV
        else
          SHORT_SHA="${GITHUB_SHA:0:7}"
          APP_VERSION="${{ inputs.environment }}-${SHORT_SHA}"
          echo "Using generated version: $APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
        fi

    - name: Import existing authorizer log group
      shell: bash
      working-directory: terraform
      run: |
        set -euo pipefail

        project_name="${TF_VAR_project_name:-now-playing}"
        log_group_name="/aws/lambda/${project_name}-api-authorizer-${{ inputs.environment }}"

        if terraform state show aws_cloudwatch_log_group.auth_logs >/dev/null 2>&1; then
          echo "Authorizer log group is already managed by Terraform"
          exit 0
        fi

        if aws logs describe-log-groups --log-group-name-prefix "$log_group_name" --query 'logGroups[].logGroupName' --output text | tr '\t' '\n' | grep -Fxq "$log_group_name"; then
          terraform import -input=false aws_cloudwatch_log_group.auth_logs "$log_group_name"
        else
          echo "No existing authorizer log group to import"
        fi

    - name: Terraform plan
      id: plan
      shell: bash
      working-directory: terraform
      run: terraform plan -no-color -out=tfplan -var="app_version=${{ env.APP_VERSION }}" -var="git_sha=${{ github.sha }}"

    - name: Terraform apply
      shell: bash
      working-directory: terraform
      run: terraform apply -auto-approve tfplan
