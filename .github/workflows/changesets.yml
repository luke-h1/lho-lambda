name: Changesets

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changeset-status:
    name: Changeset present
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test the release notes script
        run: bun test scripts

      - name: Check the pull request adds a changeset
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          git fetch origin "$BASE_REF"
          if git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" -- '.changeset/*.md' | grep -qv '/README.md$'; then
            exit 0
          fi
          echo "::error::No changeset in this pull request. Run 'bun run changeset', or 'bun run changeset -- --empty' when there is nothing to tell a user."
          exit 1

      - name: Check every changed package has a changeset
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bun run changeset -- status --since="origin/${BASE_REF}"

      - name: Check every note has a bump and text
        run: bun scripts/release-notes.ts pending
