name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VAR_env: live
  TF_VAR_env_vars: ${{ secrets.LIVE_ENV_VARS }}
  TF_VAR_zone_id: ${{ secrets.LIVE_ZONE_ID }}
  TF_VAR_root_domain: lhowsam.com
  TF_VAR_sub_domain: nowplaying.lhowsam.com
  TF_VAR_private_key: ${{ secrets.LIVE_PRIVATE_KEY }}
  TF_VAR_certificate_body: ${{ secrets.LIVE_CERTIFICATE_BODY }}
  TF_VAR_certificate_chain: ${{ secrets.LIVE_CERTIFICATE_CHAIN }}
  TF_VAR_deployed_by: ${{ github.actor }}
  TF_VAR_git_sha: ${{ github.sha }}
  TF_VAR_api_key: ${{ secrets.LIVE_API_KEY }}
  TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_ALERTS_WEBHOOK_URL }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT with contents write; GITHUB_TOKEN cannot push to main under the main_protect ruleset
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Lho.Lambda.slnx

      - name: Test
        run: dotnet test src/Lho.Lambda.Tests/Lho.Lambda.Tests.csproj --no-restore

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set release version
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RELEASE_VERSION="live.${SHORT_SHA}"
          echo "version=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${RELEASE_VERSION}"

      - name: Deploy to Production
        uses: ./.github/actions/deploy
        with:
          environment: live
          aws-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          version: ${{ steps.version.outputs.version }}

      - name: Update changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if bun scripts/release-notes.ts show --version "${VERSION}" > /dev/null 2>&1; then
            echo "CHANGELOG.md already has a section for ${VERSION}"
          else
            bun scripts/release-notes.ts release --version "${VERSION}"
          fi
          bun scripts/release-notes.ts show --version "${VERSION}" > "$RUNNER_TEMP/release-notes.md"
          echo "notes_path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

          git add CHANGELOG.md .changeset
          if git diff --cached --quiet; then
            echo "CHANGELOG.md already carries ${VERSION}"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "luke-h1"
            git config user.email "55030296+luke-h1@users.noreply.github.com"
            git commit -m "chore(changelog): release ${VERSION} [skip ci]"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.changelog.outputs.release_sha }}
          NOTES_PATH: ${{ steps.changelog.outputs.notes_path }}
        with:
          script: |
            const fs = require('node:fs');
            const version = process.env.VERSION;
            const tag = `v${version}`;
            const releaseSha = process.env.RELEASE_SHA || context.sha;
            const body = fs.readFileSync(process.env.NOTES_PATH, 'utf8');
            
            // Check if tag already exists
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              console.log(`Tag ${tag} already exists, skipping release`);
              return;
            } catch (e) {
              // Tag doesn't exist, create release
            }
            
            // Create tag
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: releaseSha
            });
            
            // Create release
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body,
              draft: false,
              prerelease: false
            });
